<p style="color: blue; font-size: 20px;text-align: center;">{{mensaje}}</p>

<div class="container my-4">
  <div class="row g-4">
    @for (_cliente of arrayClientes; track _cliente.idcliente) {
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm">
          <!-- Opcional: Imagen del cliente -->
          <img
            src="{{ _cliente.imagencliente}}"
            (error)="$event.target.src = 'imagenes/home.avif'"
            class="card-img-top"
            alt="Avatar">
          
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ _cliente.nombre }}</h5>
            <p class="card-text text-muted mb-4">{{ _cliente.nombre }}</p>
            
            <!-- Botón alineado al fondo gracias a flex-column y mt-auto -->
            <a href="{{_cliente.paginaweb}}" class="btn btn-primary mt-auto">Ver Perfil</a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
